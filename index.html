<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幣安合約 PRO 篩選器</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;overflow-x:hidden;}
body{background:#f0f4f8;color:#2a3a4a;font-family:'Noto Sans TC',sans-serif;min-height:100vh;}

/* ── 變數 ── */
:root{
  --long:#007a52;--short:#cc1133;--watch:#b86b00;--neu:#1a5fc8;
  --bg:#f0f4f8;--bg2:#e4eaf2;--panel:#d8e0ea;
  --border:#c0cdd8;--bdr2:#a8bac8;
  --text:#2a3a4a;--textlo:#7a90a8;--texthi:#0a1520;
  --mono:'IBM Plex Mono',monospace;
}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:100;background:#f0f4f8f0;
  backdrop-filter:blur(10px);border-bottom:1px solid var(--bdr2);
  display:flex;align-items:center;padding:0 14px;height:46px;gap:10px;}
.hlogo{font-family:var(--mono);font-size:.75rem;font-weight:700;color:var(--neu);letter-spacing:2px;flex-shrink:0;}
.hlogo em{color:var(--textlo);font-style:normal;}
.hticker{flex:1;overflow:hidden;white-space:nowrap;font-family:var(--mono);font-size:.55rem;color:var(--textlo);
  -webkit-mask-image:linear-gradient(90deg,transparent,black 8%,black 92%,transparent);}
.hlive{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--textlo);}
.ldot.on{background:var(--long);}
.ltxt{font-family:var(--mono);font-size:.56rem;color:var(--textlo);}

/* ── TABS ── */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);}
.tab{flex:1;padding:10px 4px;font-family:var(--mono);font-size:.58rem;color:var(--textlo);
  cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;text-align:center;}
.tab.on-all{color:var(--neu);border-color:var(--neu);}
.tab.on-long{color:var(--long);border-color:var(--long);}
.tab.on-short{color:var(--short);border-color:var(--short);}
.tab.on-watch{color:var(--watch);border-color:var(--watch);}

/* ── SCAN BAR ── */
.scanbar{display:flex;align-items:center;gap:7px;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.sblbl{font-family:var(--mono);font-size:.55rem;color:var(--textlo);}
select{background:var(--bg2);border:1px solid var(--bdr2);color:var(--text);
  font-family:var(--mono);font-size:.6rem;padding:5px 7px;border-radius:4px;}
.prog-wrap{flex:1;min-width:40px;height:3px;background:var(--bdr2);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:var(--long);width:0%;transition:width .3s;}
.prog-txt{font-family:var(--mono);font-size:.52rem;color:var(--textlo);white-space:nowrap;}
.scan-btn{padding:7px 14px;border-radius:4px;border:1.5px solid var(--long);
  background:#007a520f;color:var(--long);font-family:var(--mono);font-size:.65rem;
  font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.scan-btn:active{background:#007a5222;}
.scan-btn:disabled{opacity:.4;cursor:not-allowed;}

/* ── STATS ── */
.statrow{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border);}
.sc{padding:9px 6px;border-right:1px solid var(--border);text-align:center;}
.sc:nth-child(3n){border-right:none;}
.sc:nth-child(n+4){border-top:1px solid var(--border);}
.scv{font-family:var(--mono);font-size:1.1rem;font-weight:700;}
.scl{font-size:.5rem;color:var(--textlo);letter-spacing:.5px;margin-top:2px;}
.cl{color:var(--long);}.cs{color:var(--short);}.cw{color:var(--watch);}.cn{color:var(--neu);}

/* ── BTC PANEL ── */
.btcbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 14px;background:var(--bg2);border-bottom:1px solid var(--border);}
.btclbl{font-family:var(--mono);font-size:.54rem;color:var(--textlo);flex-shrink:0;}
.btcval{font-family:var(--mono);font-size:.68rem;font-weight:700;}
.btchg{font-family:var(--mono);font-size:.6rem;}
.btcbadge{font-family:var(--mono);font-size:.52rem;padding:2px 8px;border-radius:3px;border:1px solid;white-space:nowrap;}
.bb-bull{color:var(--long);border-color:#007a5250;background:#007a520d;}
.bb-bear{color:var(--short);border-color:#cc113350;background:#cc11330d;}
.bb-neu{color:var(--watch);border-color:#b86b0050;background:#b86b000d;}
.btcwarn{font-family:var(--mono);font-size:.52rem;color:var(--short);
  padding:2px 8px;border-radius:3px;background:#cc11330d;border:1px solid #cc113340;}

/* ── LIMIT BANNER ── */
.limitbar{display:none;align-items:center;gap:8px;padding:7px 14px;
  background:#b86b0010;border-bottom:2px solid #b86b0040;}
.limitbar.show{display:flex;}
.limittxt{font-family:var(--mono);font-size:.58rem;color:var(--watch);flex:1;line-height:1.5;}
.limitcount{font-family:var(--mono);font-size:.85rem;font-weight:700;color:var(--watch);flex-shrink:0;}

.ts{padding:4px 14px;font-family:var(--mono);font-size:.52rem;color:var(--textlo);border-bottom:1px solid var(--border);}
.errbox{margin:8px 14px;padding:8px 12px;background:#cc11330a;border:1px solid #cc113330;
  border-radius:4px;font-family:var(--mono);font-size:.6rem;color:var(--short);display:none;}

/* ── FILTER BARS ── */
.filterbar{display:flex;gap:5px;flex-wrap:wrap;padding:7px 14px;
  background:var(--bg);border-bottom:1px solid var(--border);align-items:center;}
.fbarlbl{font-family:var(--mono);font-size:.52rem;color:var(--textlo);flex-shrink:0;}
.fbtn{font-family:var(--mono);font-size:.52rem;padding:3px 9px;border-radius:10px;
  border:1px solid var(--border);background:transparent;color:var(--textlo);cursor:pointer;white-space:nowrap;}
.fbtn:active{opacity:.7;}
.fbtn.fa{border-color:var(--long);color:var(--long);background:#007a520d;}
.fbtn.fs{border-color:var(--short);color:var(--short);background:#cc11330d;}
.fbtn.fw{border-color:var(--watch);color:var(--watch);background:#b86b000d;}
.fbtn.fn{border-color:var(--neu);color:var(--neu);background:#1a5fc80d;}

/* ── SORT BAR ── */
.sortbar{display:flex;gap:5px;flex-wrap:wrap;padding:7px 14px;
  background:var(--bg2);border-bottom:1px solid var(--border);align-items:center;}
.sortlbl{font-family:var(--mono);font-size:.52rem;color:var(--textlo);flex-shrink:0;}
.sbtn{font-family:var(--mono);font-size:.52rem;padding:3px 9px;border-radius:4px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;white-space:nowrap;}
.sbtn.on{border-color:var(--neu);color:var(--neu);background:#1a5fc80d;font-weight:600;}

/* ── SEARCH ── */
.searchbar{display:flex;gap:8px;padding:7px 14px;border-bottom:1px solid var(--border);}
.sinput{flex:1;background:var(--bg2);border:1.5px solid var(--bdr2);color:var(--texthi);
  font-family:var(--mono);font-size:.68rem;padding:6px 12px;border-radius:6px;outline:none;}
.sinput:focus{border-color:var(--neu);}
.sinput::placeholder{color:var(--textlo);}
.sclear{font-family:var(--mono);font-size:.6rem;padding:6px 12px;border-radius:6px;
  border:1px solid var(--border);background:transparent;color:var(--textlo);cursor:pointer;white-space:nowrap;}

/* ── CARDS ── */
.cardlist{padding-bottom:60px;}
.loadstate{padding:60px;text-align:center;color:var(--textlo);font-family:var(--mono);font-size:.7rem;}
.emptystate{padding:40px;text-align:center;color:var(--textlo);font-family:var(--mono);font-size:.7rem;}

.card{border-bottom:1px solid var(--border);padding:10px 14px;cursor:pointer;background:var(--bg);}
.card:active{background:var(--bg2);}

/* card row 1: grade + sym + price + chg | sig */
.crow1{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.grade{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:.6rem;font-weight:700;border:2px solid;flex-shrink:0;}
.ga{color:var(--long);border-color:var(--long);background:#007a5212;}
.gb{color:var(--neu);border-color:var(--neu);background:#1a5fc812;}
.gc{color:var(--watch);border-color:var(--watch);background:#b86b0012;}
.csym{font-family:var(--mono);font-weight:700;color:var(--texthi);font-size:.8rem;flex-shrink:0;}
.csym sub{color:var(--textlo);font-weight:400;font-size:.48rem;}
.cprice{font-family:var(--mono);font-size:.68rem;color:var(--text);flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.cchg{font-family:var(--mono);font-size:.65rem;flex-shrink:0;white-space:nowrap;}
.pos{color:var(--long);}.neg{color:var(--short);}
.sig{font-family:var(--mono);font-size:.56rem;font-weight:700;padding:3px 8px;
  border-radius:3px;border:1px solid;flex-shrink:0;white-space:nowrap;}
.sl{color:var(--long);border-color:#007a5255;background:#007a5210;}
.ss{color:var(--short);border-color:#cc113355;background:#cc113310;}
.sw{color:var(--watch);border-color:#b86b0055;background:#b86b0010;}
.sn{color:var(--textlo);border-color:var(--border);background:transparent;}

/* card row 2: EMA pills + distances */
.crow2{display:flex;align-items:center;gap:5px;margin-bottom:5px;flex-wrap:wrap;}
.epill{font-family:var(--mono);font-size:.5rem;padding:2px 7px;border-radius:8px;border:1px solid;font-weight:600;white-space:nowrap;}
.epa{color:var(--long);border-color:#007a5255;background:#007a520e;}
.epb{color:var(--short);border-color:#cc113355;background:#cc11330e;}
.edist{font-family:var(--mono);font-size:.62rem;font-weight:600;padding:2px 8px;
  border-radius:4px;border:1px solid;white-space:nowrap;}
.ed-pos{color:var(--long);border-color:#007a5240;background:#007a520a;}
.ed-neg{color:var(--short);border-color:#cc113340;background:#cc11330a;}

/* card row 3: score bar */
.crow3{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.gbar{flex:1;height:3px;border-radius:2px;background:var(--border);overflow:hidden;min-width:0;}
.gfill{height:100%;border-radius:2px;}
.gfl{background:var(--long);}.gfs{background:var(--short);}.gfw{background:var(--watch);}
.gnum{font-family:var(--mono);font-size:.54rem;color:var(--textlo);white-space:nowrap;flex-shrink:0;}

/* card row 4: chips */
.chips{display:flex;gap:4px;flex-wrap:wrap;}
.chip{font-family:var(--mono);font-size:.5rem;padding:2px 6px;border-radius:3px;border:1px solid;white-space:nowrap;}
.chl{color:var(--long);border-color:#007a5245;background:#007a520a;}
.chs{color:var(--short);border-color:#cc113345;background:#cc11330a;}
.chw{color:var(--watch);border-color:#b86b0045;background:#b86b000a;}
.chn{color:var(--textlo);border-color:var(--border);background:transparent;}

/* corr warning */
.corrwarn{font-family:var(--mono);font-size:.5rem;padding:3px 8px;margin-top:4px;
  background:#b86b000a;border:1px solid #b86b0035;border-radius:3px;color:var(--watch);}

/* ── CARD DETAIL ── */
.cdetail{display:none;margin-top:8px;padding:10px;background:var(--bg2);
  border:1px solid var(--bdr2);border-radius:6px;}
.card.open .cdetail{display:block;}
.dtitle{font-family:var(--mono);font-size:.52rem;color:var(--textlo);letter-spacing:1px;
  margin-bottom:6px;margin-top:8px;padding-top:7px;border-top:1px solid var(--border);}
.dtitle:first-child{margin-top:0;padding-top:0;border-top:none;}

/* 2-col grid for detail boxes */
.dg2{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:5px;}
.dbox{padding:7px 9px;border-radius:4px;border:1px solid var(--border);background:var(--bg);}
.dblbl{font-family:var(--mono);font-size:.46rem;color:var(--textlo);margin-bottom:2px;}
.dbval{font-family:var(--mono);font-size:.72rem;font-weight:700;word-break:break-all;line-height:1.3;}
.dbsub{font-family:var(--mono);font-size:.44rem;color:var(--textlo);margin-top:2px;line-height:1.4;}
.dvl{color:var(--long);}.dvs{color:var(--short);}.dvn{color:var(--texthi);}

/* 3-col only on wider screens */
.dg3{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:5px;}
@media(min-width:400px){.dg3{grid-template-columns:repeat(3,1fr);}}

.disc{font-family:var(--mono);font-size:.44rem;color:var(--textlo);
  margin-top:7px;padding-top:7px;border-top:1px solid var(--border);line-height:1.6;}

/* ── LEGEND ── */
.legend{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;
  background:var(--panel);border-top:1px solid var(--border);
  font-family:var(--mono);font-size:.5rem;color:var(--textlo);}
.legitem{display:flex;align-items:center;gap:4px;}
.legdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
</style>
</head>
<body>

<header>
  <div class="hlogo">BINANCE<em>/</em>FUTURES<em>/</em>PRO</div>
  <div class="hticker" id="hticker">—</div>
  <div class="hlive"><div class="ldot" id="ldot"></div><span class="ltxt" id="ltxt">OFFLINE</span></div>
</header>

<div class="tabs">
  <button class="tab on-all" id="tab-all"   onclick="setTab('all',this)">◈ 全部</button>
  <button class="tab" id="tab-long"          onclick="setTab('long',this)">▲ 做多</button>
  <button class="tab" id="tab-short"         onclick="setTab('short',this)">▼ 做空</button>
  <button class="tab" id="tab-watch"         onclick="setTab('watch',this)">◉ 觀察</button>
</div>

<div class="scanbar">
  <span class="sblbl">時框</span>
  <select id="tfSel"><option value="15m">15m</option><option value="1h" selected>1H</option><option value="4h">4H</option><option value="1d">1D</option></select>
  <span class="sblbl">幣種</span>
  <select id="topN"><option value="30">前30</option><option value="60">前60</option><option value="100" selected>前100</option><option value="9999">全部</option></select>
  <div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>
  <span class="prog-txt" id="progtxt">—</span>
  <button class="scan-btn" id="scanBtn" onclick="startScan()">⟳ 掃描</button>
</div>

<div class="statrow">
  <div class="sc"><div class="scv cl" id="s0">—</div><div class="scl">▲ 做多</div></div>
  <div class="sc"><div class="scv cs" id="s1">—</div><div class="scl">▼ 做空</div></div>
  <div class="sc"><div class="scv cw" id="s2">—</div><div class="scl">◉ 觀察</div></div>
  <div class="sc"><div class="scv cl" id="s3">—</div><div class="scl">EMA雙上</div></div>
  <div class="sc"><div class="scv" id="s4" style="color:var(--texthi)">—</div><div class="scl">掃描總計</div></div>
  <div class="sc"><div class="scv" id="s5" style="color:var(--text);font-size:.9rem;">—</div><div class="scl">平均RSI</div></div>
</div>

<div class="btcbar" id="btcbar" style="display:none">
  <span class="btclbl">BTC：</span>
  <span class="btcval" id="btcprice">—</span>
  <span class="btchg" id="btcchg">—</span>
  <span class="btcbadge" id="btcbadge">—</span>
  <span class="btcbadge" id="btcema">—</span>
  <span class="btcwarn" id="btcwarn" style="display:none">⚠ 大盤空頭，慎開多單</span>
</div>

<div class="limitbar" id="limitbar">
  <span style="font-size:1rem">⚠</span>
  <span class="limittxt">信號數量較多，建議<strong>最多只選 3 個</strong>幣種開單，避免過度持倉。</span>
  <span class="limitcount" id="limitcount">0個</span>
</div>

<div class="errbox" id="errbox"></div>
<div class="ts" id="tsline"></div>

<!-- SORT -->
<div class="sortbar">
  <span class="sortlbl">排序：</span>
  <button class="sbtn on" data-k="score"        onclick="setSort('score',this)">評分 ↓</button>
  <button class="sbtn"    data-k="rsi"           onclick="setSort('rsi',this)">RSI</button>
  <button class="sbtn"    data-k="chg"           onclick="setSort('chg',this)">漲跌%</button>
  <button class="sbtn"    data-k="volRatio"      onclick="setSort('volRatio',this)">量比</button>
  <button class="sbtn"    data-k="funding"       onclick="setSort('funding',this)">資費率</button>
  <button class="sbtn"    data-k="distEma99Abs"  onclick="setSort('distEma99Abs',this)">EMA99距離</button>
  <button class="sbtn"    data-k="distEma200Abs" onclick="setSort('distEma200Abs',this)">EMA200距離</button>
</div>

<!-- GRADE FILTER -->
<div class="filterbar">
  <span class="fbarlbl">評級：</span>
  <button class="fbtn fn" onclick="setGrade('all',this)">全部</button>
  <button class="fbtn" onclick="setGrade('A',this)">🟢 A級</button>
  <button class="fbtn" onclick="setGrade('B',this)">🔵 B級以上</button>
  <button class="fbtn" onclick="setGrade('C',this)">🟡 C級</button>
</div>

<!-- EMA FILTER -->
<div class="filterbar">
  <span class="fbarlbl">EMA：</span>
  <button class="fbtn fn" onclick="setEmaF('all',this)">全部</button>
  <button class="fbtn" onclick="setEmaF('above_both',this)">↑ 雙上方</button>
  <button class="fbtn" onclick="setEmaF('below_both',this)">↓ 雙下方</button>
  <button class="fbtn" onclick="setEmaF('above99',this)">↑ EMA99上</button>
  <button class="fbtn" onclick="setEmaF('below99',this)">↓ EMA99下</button>
  <button class="fbtn" onclick="setEmaF('above200',this)">↑ EMA200上</button>
  <button class="fbtn" onclick="setEmaF('below200',this)">↓ EMA200下</button>
  <button class="fbtn" onclick="setEmaF('between',this)">⇔ 夾在之間</button>
</div>

<!-- MACD FILTER -->
<div class="filterbar">
  <span class="fbarlbl">MACD：</span>
  <button class="fbtn fn" onclick="setMacdF('all',this)">全部</button>
  <button class="fbtn" onclick="setMacdF('golden',this)">▲ 金叉</button>
  <button class="fbtn" onclick="setMacdF('dead',this)">▼ 死叉</button>
  <button class="fbtn" onclick="setMacdF('above',this)">柱在零軸上</button>
  <button class="fbtn" onclick="setMacdF('below',this)">柱在零軸下</button>
</div>

<!-- SEARCH -->
<div class="searchbar">
  <input class="sinput" id="sinput" type="text" placeholder="搜尋幣種，例如 BTC ETH SOL…"
    oninput="setSearch(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
  <button class="sclear" onclick="clearSearch()">✕ 清除</button>
</div>

<div class="cardlist" id="cardlist">
  <div class="loadstate">按「掃描」載入數據...</div>
</div>

<div class="legend">
  <div class="legitem"><div class="legdot" style="background:var(--long)"></div>EMA雙上=強多頭</div>
  <div class="legitem"><div class="legdot" style="background:var(--short)"></div>EMA雙下=強空頭</div>
  <div class="legitem"><div class="legdot" style="background:var(--watch)"></div>夾在EMA之間=震盪</div>
  <div class="legitem">⚠ 僅供參考，非投資建議</div>
</div>

<script>
const API='https://fapi.binance.com';
const BATCH=5;

// 排除清單：穩定幣、美股代幣、石油、貴金屬
const EXCL=new Set([
  // 穩定幣
  'USDC','USDD','USDP','TUSD','BUSD','DAI','FRAX','LUSD','GUSD','FDUSD','PYUSD','EURC','EURS','EURT',
  // 美股代幣（含1000前綴版本）
  'AAPL','1000AAPL','TSLA','1000TSLA','AMZN','GOOGL','MSFT','NVDA','META','NFLX',
  'BABA','UBER','COIN','PYPL','AMD','INTC','BIDU','JNJ','JPM','BAC','WMT','DIS',
  'V','ABNB','PLTR','HOOD','MSTR','MARA','RIOT','CLSK','CORZ','CIFR','HUT','BTDR',
  // 石油、天然氣
  'OIL','CRUDE','WTI','BRENT','NGAS','NATGAS',
  // 貴金屬
  'XAU','XAG','XPT','XPD','GOLD','SILVER','PAXG','XAUT','CACHE',
  // 銅等金屬
  'COPPER','1000COPPER','COPPERFUTURES',
]);

// 前綴排除（symbol 開頭符合就排除）
const EXCL_PREFIX=['1000AAPL','1000TSLA','1000COPPER'];

function isExcluded(base){
  if(EXCL.has(base))return true;
  // 含美股關鍵字的合成代幣
  if(/^(AAPL|TSLA|AMZN|GOOGL|MSFT|NVDA|META|NFLX|BABA|COIN|PLTR|MSTR|MARA|RIOT)/.test(base))return true;
  // 貴金屬關鍵字
  if(/^(XAU|XAG|GOLD|SILVER|COPPER)/.test(base))return true;
  // 石油關鍵字
  if(/^(OIL|CRUDE|WTI|BRENT|NGAS)/.test(base))return true;
  return false;
}

// ═══════════════ SCAN ═══════════════
async function startScan(){
  const btn=document.getElementById('scanBtn');
  const tf=document.getElementById('tfSel').value;
  const topN=parseInt(document.getElementById('topN').value);
  btn.disabled=true; btn.textContent='掃描中…';
  setLive('SCANNING','var(--neu)'); hideErr(); showLoad(); setProg(0,'準備…');

  try{
    const [tickers,funding]=await Promise.all([
      fetchJ(`${API}/fapi/v1/ticker/24hr`),
      fetchJ(`${API}/fapi/v1/premiumIndex`)
    ]);

    await analyzeBTC(tf);

    const fmap={};
    funding.forEach(f=>{fmap[f.symbol]=parseFloat(f.lastFundingRate)*100;});

    let list=tickers.filter(t=>{
      if(!t.symbol.endsWith('USDT'))return false;

      return true;
    }).sort((a,b)=>parseFloat(b.quoteVolume)-parseFloat(a.quoteVolume));

    const results=[];

      const batch=list.slice(i,i+BATCH);
      const settled=await Promise.allSettled(batch.map(t=>analyzeOne(t,fmap,tf)));
      settled.forEach(r=>{if(r.status==='fulfilled'&&r.value)results.push(r.value);});
      const done=Math.min(i+BATCH,list.length);
      setProg(done/list.length*100,`${done}/${list.length}`);
    }

    allData=results;
    render(); updateStats(); updateTicker(); updateLimit();
    document.getElementById('tsline').textContent='最後更新：'+new Date().toLocaleString('zh-TW');

    setLive('ERROR','var(--short)');
  }
  btn.disabled=false; btn.textContent='⟳ 重新掃描';
  setProg(100,'完成');
}

// ═══════════════ ANALYZE ═══════════════
async function analyzeOne(ticker,fmap,tf){
  const sym=ticker.symbol;
  const price=parseFloat(ticker.lastPrice);
  const chg=parseFloat(ticker.priceChangePercent);

  const kl=await fetchJ(`${API}/fapi/v1/klines?symbol=${sym}&interval=${tf}&limit=500`);
  const cl=kl.map(k=>parseFloat(k[4]));
  const hi=kl.map(k=>parseFloat(k[2]));
  const lo=kl.map(k=>parseFloat(k[3]));
  const vo=kl.map(k=>parseFloat(k[5]));

  const rsi=calcRSI(cl,14);

  // MACD
  const {hist,macdLine,signalLine}=calcMACD(cl,12,26,9);
  const lH=hist[hist.length-1], pH=hist[hist.length-2];
  let macdSig=0;
  if(lH>0&&pH<=0)macdSig=2;       // 金叉
  else if(lH<0&&pH>=0)macdSig=-2; // 死叉
  else if(lH>0)macdSig=1;          // 零軸上方
  else if(lH<0)macdSig=-1;         // 零軸下方

  // EMA
  // EMA — 需要足夠K線才準確
  const hasEma99 = cl.length >= 150;   // EMA99需至少150根
  const hasEma200 = cl.length >= 300;  // EMA200需至少300根才夠熱身
  const e99a=calcEMA(cl,99);
  const e200a=calcEMA(cl,200);
  const ema99=hasEma99?e99a[e99a.length-1]:null;
  const ema200=hasEma200?e200a[e200a.length-1]:null;
  const ema99dir=hasEma99&&ema99>e99a[e99a.length-2]?'up':'down';
  const ema200dir=hasEma200&&ema200>e200a[e200a.length-2]?'up':'down';
  const aboveEma99=hasEma99?price>ema99:null;
  const aboveEma200=hasEma200?price>ema200:null;
  const distEma99=hasEma99?((price-ema99)/ema99*100).toFixed(2):null;
  const distEma200=hasEma200?((price-ema200)/ema200*100).toFixed(2):null;
  const distEma99Abs=hasEma99?Math.abs(parseFloat(distEma99)):999;
  const distEma200Abs=hasEma200?Math.abs(parseFloat(distEma200)):999;

  let emaStatus='unknown';
  if(hasEma99&&hasEma200){
    emaStatus=aboveEma99&&aboveEma200?'above_both':!aboveEma99&&!aboveEma200?'below_both':'between';
  }else if(hasEma99){
    emaStatus=aboveEma99?'above99only':'below99only';
  }
  let emaScore=0;
  if(emaStatus==='above_both')emaScore=ema99dir==='up'&&ema200dir==='up'?25:20;
  else if(emaStatus==='below_both')emaScore=ema99dir==='down'&&ema200dir==='down'?-25:-20;
  else if(emaStatus==='between')emaScore=aboveEma200?5:-5;
  else if(emaStatus==='above99only')emaScore=8;
  else if(emaStatus==='below99only')emaScore=-8;

  // Breakout
  const LB=20;
  const rHigh=Math.max(...hi.slice(-LB-1,-1)); const rLow=Math.min(...lo.slice(-LB-1,-1));
  const curC=cl[cl.length-1];
  const breakout=curC>rHigh?1:curC<rLow?-1:0;
  const supportLvl=Math.min(...lo.slice(-LB)); const resistanceLvl=Math.max(...hi.slice(-LB));

  // Entry
  const longEntry=+(price*0.997).toPrecision(6);
  const longStop=+(price*0.980).toPrecision(6);
  const longTP=+(longEntry+(longEntry-longStop)*2).toPrecision(6);
  const shortEntry=+(price*1.003).toPrecision(6);
  const shortStop=+(price*1.020).toPrecision(6);
  const shortTP=+(shortEntry-(shortStop-shortEntry)*2).toPrecision(6);

  // Volume
  const rvol=avg(vo.slice(-3)); const bvol=avg(vo.slice(-22,-3));
  const volRatio=bvol>0?rvol/bvol:1;
  const funding=fmap[sym]??0;

  // Smart money
  const oiChg=chg>0?(volRatio>1.3?1:0.3):(volRatio>1.3?-1:-0.3);
  let smartMoney=0;
  if(oiChg>0.5&&chg>1&&volRatio>1.5)smartMoney=2;
  else if(oiChg>0.3&&chg>0)smartMoney=1;
  else if(oiChg<-0.5&&chg<-1&&volRatio>1.5)smartMoney=-2;
  else if(oiChg<-0.3&&chg<0)smartMoney=-1;

  // BB
  const {upper:bbUpper,mid:bbMid,lower:bbLower,bw:bbBW,pct:bbPct}=calcBB(cl,20,2);
  let bbSig=bbPct<=0.05?2:bbPct<=0.2?1:bbPct>=0.95?-2:bbPct>=0.8?-1:0;

  // KDJ
  const {K,D,J}=calcKDJ(hi,lo,cl,9,3);
  const Klast=K[K.length-1],Dlast=D[D.length-1],Jlast=J[J.length-1];
  const Kprev=K[K.length-2],Dprev=D[D.length-2];
  let kdjSig=0;
  if(Klast>Dlast&&Kprev<=Dprev&&Klast<50)kdjSig=2;
  else if(Klast>Dlast&&Kprev<=Dprev)kdjSig=1;
  else if(Klast<Dlast&&Kprev>=Dprev&&Klast>50)kdjSig=-2;
  else if(Klast<Dlast&&Kprev>=Dprev)kdjSig=-1;
  if(Jlast<10&&kdjSig>=0)kdjSig=Math.max(kdjSig,1);
  if(Jlast>90&&kdjSig<=0)kdjSig=Math.min(kdjSig,-1);

  // VP
  const lC=cl[cl.length-1],pC=cl[cl.length-2];
  const lV=vo[vo.length-1],pV=vo[vo.length-2];
  const pUp=lC>pC,vUp=lV>pV;
  let vpSig=pUp&&vUp&&volRatio>1.5?2:pUp&&vUp?1:!pUp&&vUp&&volRatio>1.5?-2:!pUp&&vUp?-1:pUp?0.5:-0.5;

  // SCORE
  let ls=0,ss=0;
  if(rsi<25)ls+=20;else if(rsi<35)ls+=14;else if(rsi<45)ls+=6;
  if(rsi>75)ss+=20;else if(rsi>65)ss+=14;else if(rsi>55)ss+=6;
  if(macdSig>=2)ls+=15;else if(macdSig>=1)ls+=6;
  if(macdSig<=-2)ss+=15;else if(macdSig<=-1)ss+=6;
  if(emaScore>=25)ls+=20;else if(emaScore>=20)ls+=16;else if(emaScore>0)ls+=6;
  if(emaScore<=-25)ss+=20;else if(emaScore<=-20)ss+=16;else if(emaScore<0)ss+=6;
  if(bbSig>=2)ls+=10;else if(bbSig>=1)ls+=5;
  if(bbSig<=-2)ss+=10;else if(bbSig<=-1)ss+=5;
  if(kdjSig>=2)ls+=10;else if(kdjSig>=1)ls+=5;
  if(kdjSig<=-2)ss+=10;else if(kdjSig<=-1)ss+=5;
  if(vpSig>=2)ls+=8;else if(vpSig>=1)ls+=4;
  if(vpSig<=-2)ss+=8;else if(vpSig<=-1)ss+=4;
  if(breakout===1)ls+=7;if(breakout===-1)ss+=7;
  if(volRatio>3){ls+=5;ss+=5;}else if(volRatio>2){ls+=3;ss+=3;}else if(volRatio>1.5){ls+=2;ss+=2;}
  if(funding<-0.08)ls+=8;else if(funding<-0.03)ls+=4;
  if(funding>0.08)ss+=8;else if(funding>0.03)ss+=4;
  if(smartMoney===2)ls+=8;else if(smartMoney===1)ls+=4;
  if(smartMoney===-2)ss+=8;else if(smartMoney===-1)ss+=4;

  const THRESH=42;
  let signal='none';
  if(ls>=THRESH&&ls>ss)signal='long';
  else if(ss>=THRESH&&ss>ls)signal='short';
  else if(ls>=28||ss>=28)signal='watch';

  const btcOk=(signal==='long'&&btcTrend==='bull')||(signal==='short'&&btcTrend==='bear');
  if(btcOk){if(signal==='long')ls=Math.min(ls+8,100);else if(signal==='short')ss=Math.min(ss+8,100);}

  const score=signal==='long'?ls:signal==='short'?ss:Math.max(ls,ss);
  const grade=score>=70&&btcOk?'A':score>=55?'B':'C';

  return{
    symbol:sym.replace('USDT',''),rawSym:sym,
    price,chg,rsi,macdSig,breakout,volRatio,funding,
    oiChg,smartMoney,ls,ss,score,signal,emaScore,grade,btcOk,
    bbUpper,bbMid,bbLower,bbBW,bbPct,bbSig,
    Klast,Dlast,Jlast,kdjSig,vpSig,
    ema99,ema200,ema99dir,ema200dir,
    aboveEma99,aboveEma200,emaStatus,
    distEma99,distEma200,
    distEma99Abs:Math.abs(parseFloat(distEma99)),
    distEma200Abs:Math.abs(parseFloat(distEma200)),
    longEntry,longStop,longTP,shortEntry,shortStop,shortTP,
    supportLvl,resistanceLvl,
    hasEma99,hasEma200,distEma99Abs,distEma200Abs
  };
}

// ═══════════════ INDICATORS ═══════════════
function calcEMA(cl,p){const k=2/(p+1);let e=cl[0];const o=[e];for(let i=1;i<cl.length;i++){e=cl[i]*k+e*(1-k);o.push(e);}return o;}
function calcRSI(cl,p=14){
  if(cl.length<p+1)return 50;
  let g=0,l=0;
  for(let i=1;i<=p;i++){const d=cl[i]-cl[i-1];if(d>0)g+=d;else l+=Math.abs(d);}
  let ag=g/p,al=l/p;
  for(let i=p+1;i<cl.length;i++){const d=cl[i]-cl[i-1];ag=(ag*(p-1)+Math.max(d,0))/p;al=(al*(p-1)+Math.max(-d,0))/p;}
  return al===0?100:100-100/(1+ag/al);
}
function calcMACD(cl,fast=12,slow=26,sig=9){
  const ef=calcEMA(cl,fast),es=calcEMA(cl,slow);
  const ml=ef.map((v,i)=>v-es[i]);
  const sl=calcEMA(ml.slice(slow-1),sig);
  const hist=sl.map((v,i)=>ml[slow-1+i]-v);
  return{hist,macdLine:ml,signalLine:sl};
}
function calcBB(cl,n=20,mult=2){
  const s=cl.slice(-n);const mid=avg(s);
  const std=Math.sqrt(s.reduce((a,v)=>a+(v-mid)**2,0)/n);
  const upper=mid+mult*std,lower=mid-mult*std;
  const p=cl[cl.length-1];
  const bw=mid>0?(upper-lower)/mid*100:0;
  const pct=(upper-lower)>0?(p-lower)/(upper-lower):0.5;
  return{upper,mid,lower,bw:+bw.toFixed(2),pct:+pct.toFixed(3)};
}
function calcKDJ(hi,lo,cl,n=9,m=3){
  const K=[],D=[],J=[];let pk=50,pd=50;
  for(let i=0;i<cl.length;i++){
    const s=Math.max(0,i-n+1);
    const hh=Math.max(...hi.slice(s,i+1)),ll=Math.min(...lo.slice(s,i+1));
    const rsv=hh===ll?50:(cl[i]-ll)/(hh-ll)*100;
    const k=(pk*(m-1)+rsv)/m,d=(pd*(m-1)+k)/m,j=3*k-2*d;
    K.push(k);D.push(d);J.push(j);pk=k;pd=d;
  }
  return{K,D,J};
}
function avg(a){return a.length?a.reduce((s,v)=>s+v,0)/a.length:0;}
function fmtP(p){
  if(isNaN(p)||p===null)return'—';
  if(p>=10000)return p.toLocaleString('en',{minimumFractionDigits:1,maximumFractionDigits:1});
  if(p>=1000)return p.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(p>=1)return p.toFixed(4);if(p>=0.001)return p.toFixed(5);return p.toFixed(7);
}

    <span class="cprice">${fmtP(d.price)}</span>
    <span class="cchg ${chgCls}">${chgStr}</span>
    <span class="sig ${sigCls}">${sigStr}</span>
  </div>
  <div class="crow2">
    <span class="epill ${d.hasEma99?p99cls:'chn'}">${p99str}</span>
    <span class="epill ${d.hasEma200?p200cls:'chn'}">${p200str}</span>
    <span class="edist ${d99cls}">${dist99str}</span>
    <span class="edist ${d200cls}">${dist200str}</span>
  </div>
  <div class="crow3">
    <div class="gbar"><div class="gfill ${gfCls}" style="width:${Math.min(d.score,100)}%"></div></div>
    <span class="gnum">評分 ${d.score} | 多${d.ls} 空${d.ss}</span>
  </div>
  <div class="chips">
    <span class="chip ${rsiCls}">RSI ${d.rsi.toFixed(1)}</span>
    <span class="chip ${macdCls}">${macdStr}</span>
    <span class="chip ${boCls}">${boStr}</span>
    <span class="chip ${volCls}">量比 ${d.volRatio.toFixed(1)}x</span>
    <span class="chip ${fundCls}">費率 ${(d.funding>=0?'+':'')+d.funding.toFixed(4)}%</span>
    <span class="chip ${bbCls}">${bbStr}</span>
    <span class="chip ${kdjCls}">${kdjStr} ${kdjVal}</span>
    <span class="chip ${vpCls}">${vpStr}</span>
    ${btcChip}
  </div>
  ${showCorr?'<div class="corrwarn">⚠ 同方向信號過多，山寨幣高度相關，建議最多選 1-2 個</div>':''}
  <div class="cdetail">
    <div class="dtitle">▸ EMA 趨勢</div>
    <div class="dg3">
      <div class="dbox"><div class="dblbl">現價</div><div class="dbval dvn">${fmtP(d.price)}</div></div>
      <div class="dbox"><div class="dblbl">EMA 99</div><div class="dbval ${ema99vcls}">${fmtP(d.ema99)}</div><div class="dbsub" style="color:${ema99dc}">${d.ema99dir==='up'?'↑向上':'↓向下'} | 價格${d.aboveEma99?'上方':'下方'}</div></div>
      <div class="dbox"><div class="dblbl">EMA 200</div><div class="dbval ${ema200vcls}">${fmtP(d.ema200)}</div><div class="dbsub" style="color:${ema200dc}">${d.ema200dir==='up'?'↑向上':'↓向下'} | 價格${d.aboveEma200?'上方':'下方'}</div></div>
    </div>
    <div class="dtitle">▸ 布林通道 BB(20,2)</div>
    <div class="dg3">
      <div class="dbox"><div class="dblbl">上軌（阻力）</div><div class="dbval dvs">${fmtP(d.bbUpper)}</div></div>
      <div class="dbox"><div class="dblbl">中軌 MA20</div><div class="dbval dvn">${fmtP(d.bbMid)}</div><div class="dbsub">%B: ${(d.bbPct*100).toFixed(0)}% | 帶寬: ${d.bbBW}%</div></div>
      <div class="dbox"><div class="dblbl">下軌（支撐）</div><div class="dbval dvl">${fmtP(d.bbLower)}</div></div>
    </div>
    <div class="dtitle">▸ KDJ(9,3,3)</div>
    <div class="dg3">
      <div class="dbox"><div class="dblbl">K 值</div><div class="dbval ${d.Klast<30?'dvl':d.Klast>70?'dvs':'dvn'}">${d.Klast.toFixed(1)}</div><div class="dbsub">${d.Klast<30?'超賣':d.Klast>70?'超買':'中性'}</div></div>
      <div class="dbox"><div class="dblbl">D 值</div><div class="dbval ${d.Dlast<30?'dvl':d.Dlast>70?'dvs':'dvn'}">${d.Dlast.toFixed(1)}</div><div class="dbsub">${d.Klast>d.Dlast?'K>D 偏多':'K<D 偏空'}</div></div>
      <div class="dbox"><div class="dblbl">J 值</div><div class="dbval ${d.Jlast<10?'dvl':d.Jlast>90?'dvs':'dvn'}">${d.Jlast.toFixed(1)}</div><div class="dbsub">${d.Jlast<10?'極超賣':d.Jlast>90?'極超買':'正常'}</div></div>
    </div>
    <div class="dtitle">▸ 進場點位（現價回踩 0.3%）</div>
    <div class="dg2">
      <div class="dbox" style="border-color:#007a5230;background:#007a5206"><div class="dblbl">做多進場</div><div class="dbval dvl">${fmtP(d.longEntry)}</div><div class="dbsub">現價 −0.3%</div></div>
      <div class="dbox" style="border-color:#cc113330;background:#cc113306"><div class="dblbl">做空進場</div><div class="dbval dvs">${fmtP(d.shortEntry)}</div><div class="dbsub">現價 +0.3%</div></div>
    </div>
    <div class="dtitle">▸ 止損 / 止盈（1:2 盈虧比）</div>
    <div class="dg2">
      <div class="dbox"><div class="dblbl">多單止損 SL</div><div class="dbval dvs">${fmtP(d.longStop)}</div></div>
      <div class="dbox"><div class="dblbl">多單止盈 TP</div><div class="dbval dvl">${fmtP(d.longTP)}</div></div>
      <div class="dbox"><div class="dblbl">空單止損 SL</div><div class="dbval dvs">${fmtP(d.shortStop)}</div></div>
      <div class="dbox"><div class="dblbl">空單止盈 TP</div><div class="dbval dvl">${fmtP(d.shortTP)}</div></div>
      <div class="dbox"><div class="dblbl">支撐位</div><div class="dbval dvn">${fmtP(d.supportLvl)}</div></div>
      <div class="dbox"><div class="dblbl">阻力位</div><div class="dbval dvn">${fmtP(d.resistanceLvl)}</div></div>
    </div>
    <div class="disc">⚠ 進場點位為現價±0.3%，EMA由幣安K線即時計算。此工具僅供參考，不構成投資建議，請自行評估風險。</div>
  </div>
</div>`;
  }).join('');
}

function toggleCard(el){el.classList.toggle('open');}

// ═══════════════ UI ═══════════════
function updateStats(){
  document.getElementById('s0').textContent=allData.filter(d=>d.signal==='long').length;
  document.getElementById('s1').textContent=allData.filter(d=>d.signal==='short').length;
  document.getElementById('s2').textContent=allData.filter(d=>d.signal==='watch').length;
  document.getElementById('s3').textContent=allData.filter(d=>d.emaStatus==='above_both').length;
  document.getElementById('s4').textContent=allData.length;
  document.getElementById('s5').textContent=avg(allData.map(d=>d.rsi)).toFixed(1);
}
function updateTicker(){
  const top=[...allData].sort((a,b)=>b.score-a.score).slice(0,8);
  document.getElementById('hticker').textContent=
    top.map(d=>`${d.symbol} ${d.chg>=0?'▲':'▼'}${Math.abs(d.chg).toFixed(1)}%`).join('  ·  ');
}
function updateLimit(){
  const n=allData.filter(d=>d.signal==='long'||d.signal==='short').length;
  const bar=document.getElementById('limitbar');
  if(n>3){bar.classList.add('show');document.getElementById('limitcount').textContent=n+'個信號';}
  else bar.classList.remove('show');
}

const SLABELS={'score':'評分','rsi':'RSI','chg':'漲跌%','volRatio':'量比','funding':'資費率','distEma99Abs':'EMA99距離','distEma200Abs':'EMA200距離'};
function setSort(k,el){
  if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1;}
  document.querySelectorAll('.sbtn').forEach(b=>{b.classList.remove('on');b.textContent=SLABELS[b.dataset.k]||b.dataset.k;});
  el.classList.add('on');el.textContent=(SLABELS[k]||k)+(sortDir===-1?' ↓':' ↑');
  render();
}
function setTab(t,el){
  curTab=t;
  document.querySelectorAll('.tab').forEach(b=>b.className='tab');
  el.className='tab on-'+t;
  render();
}
function setGrade(g,el){
  gradeF=g;
  document.querySelectorAll('.filterbar .fbtn').forEach(b=>{if(b.onclick.toString().includes('setGrade'))b.className='fbtn';});
  el.className='fbtn fn';render();
}
function setEmaF(f,el){
  emaF=f;
  document.querySelectorAll('.filterbar .fbtn').forEach(b=>{if(b.onclick.toString().includes('setEmaF'))b.className='fbtn';});
  const cls=f==='above_both'||f==='above99'||f==='above200'?'fa':f==='below_both'||f==='below99'||f==='below200'?'fs':f==='between'?'fw':'fn';
  el.className='fbtn '+cls;render();
}
function setMacdF(f,el){
  macdF=f;
  document.querySelectorAll('.filterbar .fbtn').forEach(b=>{if(b.onclick.toString().includes('setMacdF'))b.className='fbtn';});
  const cls=f==='golden'||f==='above'?'fa':f==='dead'||f==='below'?'fs':'fn';
  el.className='fbtn '+cls;render();
}
function setSearch(v){searchQ=v.trim();if(allData.length)render();}
function clearSearch(){searchQ='';document.getElementById('sinput').value='';render();}

function setLive(t,c){
  document.getElementById('ltxt').textContent=t;
  const d=document.getElementById('ldot');d.style.background=c;
  d.className=t==='LIVE'?'ldot on':'ldot';
}
function setProg(p,t){document.getElementById('prog').style.width=p+'%';document.getElementById('progtxt').textContent=t;}
function showLoad(){document.getElementById('cardlist').innerHTML='<div class="loadstate">掃描中，請稍候…</div>';}
function showErr(m){const b=document.getElementById('errbox');b.style.display='block';b.textContent=m;}
function hideErr(){document.getElementById('errbox').style.display='none';}
async function fetchJ(u){const r=await fetch(u);if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();}
</script>
